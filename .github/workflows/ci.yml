name: CI

defaults:
  run:
    shell: bash

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: morningrize/cern_root:debian13

    steps:
      - uses: actions/checkout@v4

      - name: Checkout AnalysisCoreCpp
        uses: actions/checkout@v4
        with:
          repository: Morningrize/AnalysisCoreCpp
          token: ${{ secrets.ANALYSISCORECPP_READ_TOKEN }}
          path: AnalysisCoreCpp

      - name: Install git
        run: apt-get update && apt-get install -y git

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y git clang-tidy clang-format libgtest-dev libgmock-dev

      - name: Build AnalysisCoreCpp
        run: |
          cmake -S AnalysisCoreCpp -B AnalysisCoreCpp/build
          cmake --build AnalysisCoreCpp/build

      - name: Build
        run: |
          . /usr/local/bin/thisroot.sh
          mkdir build
          cd build
          cmake .. \
            -DENABLE_CLANG_TIDY=ON \
            -DBUILD_TESTS=ON \
            -DAnalysisCoreCpp_DIR="$GITHUB_WORKSPACE/AnalysisCoreCpp/build/cmake"
          cmake --build . --target tests

      - name: Run tests
        run: |
          . /usr/local/bin/thisroot.sh
          cd build
          ctest --output-on-failure

      - name: Symlink compile_commands.json to repo root
        run: |
          ln -sf build/compile_commands.json compile_commands.json

      - name: Run clang-tidy
        run: |
          . /usr/local/bin/thisroot.sh
          cd build
          cmake --build . --target tidy

      - name: Check formatting with clang-format
        run: |
          find include tests \( -name "*.h" -o -name "*.cpp" \) -print0 | xargs -0 clang-format --dry-run --Werror